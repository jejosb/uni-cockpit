<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{% block title %}uni-cockpit{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <p class="eyebrow">Hochschule Reutlingen</p>
        <a class="wordmark" href="/">uni-cockpit</a>
      </div>
      <nav aria-label="Hauptnavigation">
        <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Fristen</a>
        <a href="/stundenplan" {% if request.url.path == "/stundenplan" %}aria-current="page"{% endif %}>Stundenplan</a>
        <a href="/settings" {% if request.url.path == "/settings" %}aria-current="page"{% endif %}>Kalender</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>Zeiten in Europe/Berlin, gespeichert in UTC.</p>
    </footer>
  </body>
</html>
